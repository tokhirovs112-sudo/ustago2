<!-- Qidiruv va Filtr -->
<section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-5">
    <div class="flex items-center space-x-2 border-b border-slate-100 pb-4">
        <i class="fa-solid fa-magnifying-glass text-indigo-600 text-lg"></i>
        <h3 class="text-lg font-bold text-slate-800">Xizmat va Mutaxassis Izlash</h3>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- 1. Yo'nalish (Majburiy) -->
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                1. Yo'nalish <span class="text-red-500 font-bold lowercase">(majburiy)</span>
            </label>
            <select id="category-select" onchange="onCategoryChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition">
                <option value="">-- Yo'nalishni tanlang --</option>
                {% for category in categories.keys() %}
                    <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- 2. Xizmat turi (Majburiy) -->
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                2. Xizmat turi <span class="text-red-500 font-bold lowercase">(majburiy)</span>
            </label>
            <select id="service-select" disabled onchange="onServiceChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition disabled:opacity-50">
                <option value="">-- Avval yo'nalishni tanlang --</option>
            </select>
        </div>

        <!-- 3. Qurilma / Texnika brendi (Ixtiyoriy matn kiritish inputi) -->
        <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">
                3. Brend va model <span class="text-slate-400 font-normal lowercase">(ixtiyoriy)</span>
            </label>
            <input type="text" id="brand-input" placeholder="Masalan: Samsung, LG, iPhone 13..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition">
        </div>
    </div>

    <!-- Taxminiy Narxlar Kalkulyatori -->
    <div id="price-estimator-card" class="hidden bg-amber-50/80 border border-amber-200 rounded-xl p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold text-lg">
                🏷️
            </div>
            <div>
                <p class="text-xs font-bold text-amber-900 uppercase tracking-wider">Ushbu xizmatning taxminiy narxi:</p>
                <p id="price-estimate-text" class="text-sm font-extrabold text-amber-700">100,000 - 200,000 so'm</p>
            </div>
        </div>
        <span class="text-[11px] text-amber-600 bg-amber-100 px-2.5 py-1 rounded-md font-medium">Bozor o'rtacha narxi</span>
    </div>

    <!-- Ustalar ro'yxati -->
    <div id="technicians-list" class="pt-2">
        <div class="text-center py-8 bg-slate-50 rounded-xl border border-dashed border-slate-200">
            <p class="text-slate-400 text-sm">Yo'nalish va xizmat turini tanlasangiz, ustalar va taxminiy narxlar ko'rinadi.</p>
        </div>
    </div>
</section>
